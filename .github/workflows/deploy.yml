name: Deploy Ambition Holidays

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ambition-holidays-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Deploy Ambition Holidays only
        uses: appleboy/ssh-action@v1.2.2
        env:
          ORBIT_PASSKEY: ${{ secrets.ORBIT_PASSKEY }}
          ORBIT_SESSION_SECRET: ${{ secrets.ORBIT_SESSION_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 40m
          timeout: 90s
          request_pty: true
          envs: ORBIT_PASSKEY,ORBIT_SESSION_SECRET
          script: |
            set -e

            # Load nvm/node carefully. Do NOT source full bashrc under nounset.
            export NVM_DIR="${HOME}/.nvm"
            if [ -s "${NVM_DIR}/nvm.sh" ]; then
              # shellcheck disable=SC1091
              . "${NVM_DIR}/nvm.sh"
              nvm use 22 >/dev/null 2>&1 || nvm use default >/dev/null 2>&1 || true
            fi
            export PATH="/usr/local/bin:/usr/bin:${HOME}/.local/bin:${PATH}"

            echo "whoami=$(whoami)"
            echo "node=$(command -v node || true) $(node -v 2>/dev/null || true)"
            echo "npm=$(command -v npm || true) $(npm -v 2>/dev/null || true)"
            echo "pm2=$(command -v pm2 || true)"

            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              echo "ERROR: node/npm not found in PATH for SSH session."
              exit 1
            fi
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: pm2 not found in PATH for SSH session."
              exit 1
            fi

            # Hardcoded Ambition Holidays targets only — never other apps/sites/DBs.
            PROJECT_PATH="/var/www/ambition-holidays"
            # Durable Orbit CMS store OUTSIDE the git tree — survives every deploy forever.
            CMS_PATH="/var/www/ambition-holidays-cms"
            PM2_APP="ambition-holidays"
            APP_PORT="3004"
            EXPECTED_REPO="arnavganguly209-code/ambition-holidays"
            PUBLIC_URL="https://ambition.theglobalorbit.com"

            cd "${PROJECT_PATH}"

            echo "Verifying git remote..."
            git remote -v
            if ! git remote -v | grep -Fq "${EXPECTED_REPO}"; then
              echo "ERROR: Remote does not match expected repository ${EXPECTED_REPO}"
              exit 1
            fi

            echo "Preparing durable CMS store at ${CMS_PATH}..."
            mkdir -p "${CMS_PATH}/uploads" "${CMS_PATH}/data-uploads" "${CMS_PATH}/public-uploads"

            # Always sync LATEST live Orbit content INTO durable store BEFORE git reset.
            # Prefer project working copy (current running site), then keep existing CMS_PATH.
            if [ -f data/site-content.json ]; then
              cp -a data/site-content.json "${CMS_PATH}/site-content.json"
              echo "Synced project site-content.json -> durable CMS store"
            elif [ -L data/site-content.json ] && [ -f "${CMS_PATH}/site-content.json" ]; then
              echo "site-content already in durable store"
            fi
            if [ -d data/uploads ] && [ "$(ls -A data/uploads 2>/dev/null | wc -l)" -gt 0 ]; then
              cp -a data/uploads/. "${CMS_PATH}/data-uploads/"
              cp -a data/uploads/. "${CMS_PATH}/uploads/"
              echo "Synced data/uploads -> durable CMS store"
            fi
            if [ -d public/uploads ] && [ "$(ls -A public/uploads 2>/dev/null | wc -l)" -gt 0 ]; then
              cp -a public/uploads/. "${CMS_PATH}/public-uploads/"
              cp -a public/uploads/. "${CMS_PATH}/uploads/"
              echo "Synced public/uploads -> durable CMS store"
            fi

            # Extra safety snapshot (timestamped) before any destructive git op
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "${CMS_PATH}/snapshots"
            if [ -f "${CMS_PATH}/site-content.json" ]; then
              cp -a "${CMS_PATH}/site-content.json" "${CMS_PATH}/snapshots/site-content-${STAMP}.json"
              # keep last 20 snapshots only
              ls -1t "${CMS_PATH}/snapshots"/site-content-*.json 2>/dev/null | tail -n +21 | xargs -r rm -f
            fi

            echo "Syncing origin/main..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "Re-linking durable Orbit CMS into project (git reset cannot wipe it)..."
            mkdir -p data public
            # Remove any tracked/default copies replaced by reset
            rm -f data/site-content.json
            rm -rf data/uploads public/uploads
            mkdir -p data
            # Content JSON lives only in CMS_PATH; project gets a symlink for tooling/debug.
            if [ -f "${CMS_PATH}/site-content.json" ]; then
              ln -sfn "${CMS_PATH}/site-content.json" data/site-content.json
              echo "Linked data/site-content.json -> ${CMS_PATH}/site-content.json"
            else
              echo "WARNING: No site-content.json in durable store yet; app will seed defaults once."
            fi
            mkdir -p "${CMS_PATH}/data-uploads" "${CMS_PATH}/public-uploads" "${CMS_PATH}/uploads"
            ln -sfn "${CMS_PATH}/data-uploads" data/uploads
            ln -sfn "${CMS_PATH}/public-uploads" public/uploads
            # Mirror uploads into shared uploads/ for AMBITION_CMS_DIR readers
            if [ "$(ls -A ${CMS_PATH}/public-uploads 2>/dev/null | wc -l)" -gt 0 ]; then
              cp -a "${CMS_PATH}/public-uploads/." "${CMS_PATH}/uploads/" || true
            fi
            if [ "$(ls -A ${CMS_PATH}/data-uploads 2>/dev/null | wc -l)" -gt 0 ]; then
              cp -a "${CMS_PATH}/data-uploads/." "${CMS_PATH}/uploads/" || true
            fi

            if [ -n "${ORBIT_PASSKEY:-}" ] && [ -n "${ORBIT_SESSION_SECRET:-}" ]; then
              echo "Writing Orbit CMS env (.env.local) with durable CMS path..."
              umask 077
              printf 'ORBIT_PASSKEY=%s\nORBIT_SESSION_SECRET=%s\nAMBITION_CMS_DIR=%s\n' \
                "${ORBIT_PASSKEY}" "${ORBIT_SESSION_SECRET}" "${CMS_PATH}" > .env.local
            else
              echo "WARNING: ORBIT_PASSKEY / ORBIT_SESSION_SECRET secrets missing; /orbit login will stay disabled."
              umask 077
              printf 'AMBITION_CMS_DIR=%s\n' "${CMS_PATH}" > .env.local
            fi

            # Verify CMS content still present after link
            if [ -f "${CMS_PATH}/site-content.json" ]; then
              BYTES="$(wc -c < "${CMS_PATH}/site-content.json" | tr -d ' ')"
              echo "Durable CMS content OK (${BYTES} bytes)"
            else
              echo "WARNING: Durable CMS content file missing after deploy setup"
            fi

            echo "Installing dependencies..."
            npm install --no-audit --no-fund

            echo "Building production app..."
            # If build fails, set -e stops here — PM2 is NOT restarted.
            if ! npm run build; then
              echo "ERROR: npm run build failed"
              df -h "${PROJECT_PATH}" || df -h || true
              free -m || true
              exit 1
            fi

            echo "Updating PM2 process ${PM2_APP} only..."
            if pm2 describe "${PM2_APP}" >/dev/null 2>&1; then
              pm2 restart "${PM2_APP}" --update-env
            else
              pm2 start npm --name "${PM2_APP}" -- start -- -p "${APP_PORT}"
            fi

            pm2 save

            echo "Waiting for ${PM2_APP} to come online..."
            online_ok=0
            for i in $(seq 1 30); do
              if pm2 describe "${PM2_APP}" 2>/dev/null | grep -Eqi 'status.*online'; then
                online_ok=1
                echo "PM2 online on attempt ${i}"
                break
              fi
              sleep 2
            done
            if [ "${online_ok}" -ne 1 ]; then
              echo "ERROR: PM2 process ${PM2_APP} is not online."
              pm2 describe "${PM2_APP}" || true
              exit 1
            fi

            echo "Checking local port ${APP_PORT}..."
            port_ok=0
            for i in $(seq 1 30); do
              if command -v ss >/dev/null 2>&1; then
                if ss -ltn | grep -Eq ":${APP_PORT}\\b"; then
                  port_ok=1
                  echo "Port ${APP_PORT} listening on attempt ${i}"
                  break
                fi
              else
                port_ok=1
                break
              fi
              sleep 2
            done
            if [ "${port_ok}" -ne 1 ]; then
              echo "ERROR: Port ${APP_PORT} is not listening."
              exit 1
            fi

            echo "Local HTTP check (curl -I)..."
            local_ok=0
            for i in $(seq 1 30); do
              LOCAL_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -I "http://127.0.0.1:${APP_PORT}" || true)"
              echo "Local HTTP status attempt ${i}: ${LOCAL_CODE}"
              if [ "${LOCAL_CODE}" = "200" ]; then
                local_ok=1
                break
              fi
              sleep 2
            done
            if [ "${local_ok}" -ne 1 ]; then
              echo "ERROR: Local health check failed for http://127.0.0.1:${APP_PORT}"
              exit 1
            fi

            echo "Public HTTPS check (curl -I)..."
            public_ok=0
            for i in $(seq 1 20); do
              PUBLIC_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -I "${PUBLIC_URL}" || true)"
              echo "Public HTTP status attempt ${i}: ${PUBLIC_CODE}"
              if [ "${PUBLIC_CODE}" = "200" ]; then
                public_ok=1
                break
              fi
              PUBLIC_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${PUBLIC_URL}" || true)"
              echo "Public HTTP GET status attempt ${i}: ${PUBLIC_CODE}"
              if [ "${PUBLIC_CODE}" = "200" ]; then
                public_ok=1
                break
              fi
              sleep 3
            done
            if [ "${public_ok}" -ne 1 ]; then
              echo "ERROR: Public site did not return HTTP 200 (${PUBLIC_URL})"
              exit 1
            fi

            echo "Deploy complete: ${PM2_APP} online; ${PUBLIC_URL} returned 200."
